services:
  # ==========================================
  # INFRASTRUCTURE
  # ==========================================
  mysql:
    image: mysql:8.0
    container_name: uadb-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: identity_db
      MYSQL_USER: ${DB_USERNAME:-identity_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:-identity}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max_connections=200
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/01-app-databases.sh:/docker-entrypoint-initdb.d/01-app-databases.sh:ro
      - ./scripts/institution_seed.sql:/docker-entrypoint-initdb.d/institution_seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - uadb-network

  minio:
    image: minio/minio:latest
    container_name: uadb-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_uadb}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio123456}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - uadb-network

  # ==========================================
  # SERVICE DISCOVERY
  # ==========================================
  eureka-server:
    build:
      context: ./eureka-server
      dockerfile: Dockerfile
    container_name: uadb-eureka
    environment:
      EUREKA_URL: http://eureka-server:8761/eureka/
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8761:8761"
    networks:
      - uadb-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # ==========================================
  # MICROSERVICES
  # ==========================================
  identity-service:
    build:
      context: ./identity-service
      dockerfile: Dockerfile
    container_name: uadb-identity
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:mysql://mysql:3306/identity_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: ${DB_USERNAME:-identity_app}
      DB_PASSWORD: ${DB_PASSWORD:-identity}
      INSTITUTION_DB_URL: jdbc:mysql://mysql:3306/institution_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:?Définis BOOTSTRAP_ADMIN_EMAIL dans .env}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?Définis BOOTSTRAP_ADMIN_PASSWORD dans .env}
      BOOTSTRAP_ADMIN_NOM: ${BOOTSTRAP_ADMIN_NOM:-Administrateur}
      BOOTSTRAP_ADMIN_PRENOM: ${BOOTSTRAP_ADMIN_PRENOM:-Initial}
      BOOTSTRAP_ADMIN_TELEPHONE: ${BOOTSTRAP_ADMIN_TELEPHONE:-}
      EUREKA_URL: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-uadb-platform}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      MATCHING_SERVICE_URL: http://matching-service:8083
      ACADEMIC_SERVICE_URL: http://academic-service:8082
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - uadb-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  academic-service:
    build:
      context: ./academic-service
      dockerfile: Dockerfile
    container_name: uadb-academic
    environment:
      SPRING_PROFILES_ACTIVE: docker
      ACADEMIC_DB_URL: jdbc:mysql://mysql:3306/academic_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: ${DB_USERNAME:-identity_app}
      DB_PASSWORD: ${DB_PASSWORD:-identity}
      EUREKA_URL: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8082:8082"
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - uadb-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  matching-service:
    build:
      context: ./matching-service
      dockerfile: Dockerfile
    container_name: uadb-matching
    environment:
      SPRING_PROFILES_ACTIVE: docker
      MATCHING_DB_URL: jdbc:mysql://mysql:3306/matching_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: ${DB_USERNAME:-identity_app}
      DB_PASSWORD: ${DB_PASSWORD:-identity}
      EUREKA_URL: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-uadb-platform}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      ACADEMIC_SERVICE_URL: http://academic-service:8082
    ports:
      - "8083:8083"
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      academic-service:
        condition: service_healthy
    networks:
      - uadb-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  resource-service:
    build:
      context: ./resource-service
      dockerfile: Dockerfile
    container_name: uadb-resource
    environment:
      SPRING_PROFILES_ACTIVE: docker
      RESOURCE_DB_URL: jdbc:mysql://mysql:3306/resource_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: ${DB_USERNAME:-identity_app}
      DB_PASSWORD: ${DB_PASSWORD:-identity}
      EUREKA_URL: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_uadb}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio123456}
      MINIO_BUCKET: ${MINIO_BUCKET:-uadb-ressources}
    ports:
      - "8084:8084"
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - uadb-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: uadb-notification
    environment:
      SPRING_PROFILES_ACTIVE: docker
      NOTIFICATION_DB_URL: jdbc:mysql://mysql:3306/notification_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: ${DB_USERNAME:-identity_app}
      DB_PASSWORD: ${DB_PASSWORD:-identity}
      EUREKA_URL: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-uadb-platform}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    ports:
      - "8085:8085"
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - uadb-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: uadb-gateway
    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_URL: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8080:8080"
    depends_on:
      eureka-server:
        condition: service_healthy
      identity-service:
        condition: service_healthy
      academic-service:
        condition: service_healthy
      matching-service:
        condition: service_healthy
      resource-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    networks:
      - uadb-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

# ==========================================
# VOLUMES
# ==========================================
volumes:
  mysql_data:
    driver: local
  minio_data:
    driver: local

# ==========================================
# NETWORKS
# ==========================================
networks:
  uadb-network:
    driver: bridge
    name: uadb-network