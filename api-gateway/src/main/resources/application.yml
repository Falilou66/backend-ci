server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          routes:
            - id: identity-service
              uri: lb://identity-service
              predicates:
                - Path=/api/v1/auth/**,/api/v1/admin/**,/api/v1/utilisateurs/**

            - id: academic-service
              uri: lb://academic-service
              predicates:
                - Path=/api/v1/ufrs/**,/api/v1/filieres/**,/api/v1/niveaux/**,/api/v1/cours/**

            - id: matching-service
              uri: lb://matching-service
              predicates:
                - Path=/api/v1/matching/**

            - id: resource-service
              uri: lb://resource-service
              predicates:
                - Path=/api/v1/ressources/**,/api/v1/signalements/**

            - id: notification-service
              uri: lb://notification-service
              predicates:
                - Path=/api/v1/notifications/**

app:
  jwt:
    secret: ${JWT_SECRET}

# Eureka Client
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

# Swagger/OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
