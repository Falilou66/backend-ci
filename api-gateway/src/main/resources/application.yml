server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: identity-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/auth/**,/api/v1/admin/**,/api/v1/utilisateurs/**

            - id: academic-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/v1/ufrs/**,/api/v1/filieres/**,/api/v1/niveaux/**,/api/v1/cours/**

            - id: matching-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/v1/matching/**

            - id: resource-service
              uri: http://localhost:8084
              predicates:
                - Path=/api/v1/ressources/**,/api/v1/signalements/**

            - id: notification-service
              uri: http://localhost:8085
              predicates:
                - Path=/api/v1/notifications/**

app:
  jwt:
    secret: ${JWT_SECRET}
