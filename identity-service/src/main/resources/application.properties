# Identité du microservice
spring.application.name=identity-service
server.port=8081

# Configuration MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/identity_db}
spring.datasource.username=${DB_USERNAME:identity_app}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuration JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Configuration JWT (sera utilisée ultérieurement)
app.jwt.issuer=uadb-platform
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=86400000

# Base institutionnelle en lecture seule
institution.datasource.url=${INSTITUTION_DB_URL:jdbc:mysql://localhost:3306/institution_db}
institution.datasource.username=${DB_USERNAME:identity_app}
institution.datasource.password=${DB_PASSWORD}

# Authentification des appels interservices\ninternal.api.key=${INTERNAL_API_KEY:}\n
matching.service.url=${MATCHING_SERVICE_URL:http://localhost:8083}

academic.service.url=${ACADEMIC_SERVICE_URL:http://localhost:8082}
