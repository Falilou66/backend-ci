# Identité du microservice
spring.application.name=identity-service
server.port=8081

# Configuration MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/identity_db}
spring.datasource.username=${DB_USERNAME:identity_app}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuration JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Configuration JWT (sera utilisée ultérieurement)
app.jwt.issuer=uadb-platform
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=86400000

# Base institutionnelle en lecture seule
institution.datasource.url=${INSTITUTION_DB_URL:jdbc:mysql://localhost:3306/institution_db}
institution.datasource.username=${DB_USERNAME:identity_app}
institution.datasource.password=${DB_PASSWORD}

# Authentification des appels interservices
internal.api.key=${INTERNAL_API_KEY:}
matching.service.url=${MATCHING_SERVICE_URL:http://localhost:8083}
academic.service.url=${ACADEMIC_SERVICE_URL:http://localhost:8082}

# Eureka Client (syntaxe .properties : un bloc YAML ici est ignoré par Spring -> repli sur localhost:8761)
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30

# Swagger/OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
