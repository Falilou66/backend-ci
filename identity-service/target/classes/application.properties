# Identité du microservice
spring.application.name=identity-service
server.port=8081

# Configuration MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/identity_db}
spring.datasource.username=${DB_USERNAME:identity_app}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuration JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Configuration JWT (sera utilisée ultérieurement)
app.jwt.issuer=uadb-platform
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=86400000

