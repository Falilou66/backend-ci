server:
  port: 8083

spring:
  application:
    name: matching-service

  datasource:
    url: ${MATCHING_DB_URL:jdbc:mysql://localhost:3306/matching_db}
    username: ${DB_USERNAME:identity_app}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
