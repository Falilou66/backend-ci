server:
  port: 8084

spring:
  application:
    name: resource-service

  datasource:
    url: ${RESOURCE_DB_URL:jdbc:mysql://localhost:3306/resource_db}
    username: ${DB_USERNAME:identity_app}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
