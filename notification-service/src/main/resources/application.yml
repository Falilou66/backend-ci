server:
  port: 8085

spring:
  application:
    name: notification-service
  datasource:
    url: ${NOTIFICATION_DB_URL:jdbc:mysql://localhost:3306/notification_db}
    username: ${DB_USERNAME:identity_app}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

app:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:uadb-platform}

internal:
  api:
    key: ${INTERNAL_API_KEY:}
